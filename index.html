<title>Rute Kunjungan Salesman Valvoline</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b33;--paper:#eef3fb;--line:#12285a;--soft:#cdd8ea;--mute:#55627a;--acc:#1557c8;--navy:#0a1e4f;--ok:#1f7a4d;--warn:#9a6700}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(120deg,#051233 0%,#0a2a6e 55%,#1450b8 100%);color:#fff;border-bottom:4px solid #4da3ff}
header.top .wrap{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;padding-top:16px;padding-bottom:14px;align-items:center}
h1{margin:0;font:700 clamp(22px,5.4vw,38px)/1.05 "Barlow Condensed",sans-serif;letter-spacing:.01em}
header.top .wrap{flex-wrap:wrap}.brand{display:flex;gap:14px;align-items:center;flex:1 1 260px;min-width:0}.logo{width:clamp(54px,15vw,80px);height:auto;aspect-ratio:1;border-radius:50%;flex:none;box-shadow:0 0 0 2px #ffffff40,0 4px 14px #00000066}
.tgl{margin-top:8px;font-size:15px;opacity:.92}
.jad td.now{background:#d6e6ff;box-shadow:inset 0 -4px 0 var(--acc)}.jad td.now a{color:var(--acc)}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;background:#ffffff26;white-space:nowrap}
.sync.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px}
.sync.warn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fbbf24;margin-right:6px}
main{padding-top:20px;padding-bottom:48px}
h2{font:700 26px/1.1 "Barlow Condensed",sans-serif;margin:6px 0 4px}
.back{display:inline-block;margin:0 0 8px;color:var(--acc);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.sub{color:var(--mute);margin:0 0 14px}
.list{border-top:2px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--soft);color:inherit;text-decoration:none;min-height:54px}
.row:hover,.row:focus-visible{background:#fff;outline:none;box-shadow:inset 4px 0 0 var(--acc)}
.row b{font:700 22px/1 "Barlow Condensed",sans-serif}
.row .no{display:inline-block;width:30px;color:var(--mute);font-weight:500}
.row small{color:var(--mute)}
.row.on small{color:var(--acc);font-weight:600}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.bln{margin-left:auto;font-weight:600;font-size:15px}.bln input{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:4px;background:#fff}
.mini{font:600 12px Barlow,sans-serif;padding:4px 8px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;margin-left:4px}
.al{min-width:190px}.al input{width:calc(100% - 92px)}
.tabs button{font:600 15px Barlow,sans-serif;padding:8px 16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;border-radius:4px}
.tabs button[aria-pressed=true]{background:var(--line);color:#fff}
.tabs button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.scroll{overflow-x:auto;background:#fff}
table{border-collapse:collapse;width:100%;min-width:700px}
caption{caption-side:top;text-align:center;padding:6px;font-size:15px}
th,td{border:1px solid var(--line);padding:0 8px;height:44px;text-align:center}
th{font-weight:600;background:#fff}
td.l{text-align:left}
td a{color:#1d4ed8}
td input{width:100%;height:42px;border:0;background:transparent;font:inherit;text-align:center;padding:0 4px}
td input.k{text-align:left}
td input:focus{background:#e8f1ff}
.jad table{min-width:660px;table-layout:fixed}.jad td{height:auto;padding:0}.jad td a{display:block;padding:22px 8px;color:var(--ink);font:700 19px/1.15 "Barlow Condensed",sans-serif;text-decoration:none}.jad td a small{display:block;margin-top:4px;font:400 12px Barlow,sans-serif;color:var(--mute)}.jad td a:hover,.jad td a:focus-visible{background:#e4eeff;color:var(--acc);outline:none}
#hi a{color:var(--acc)}
.empty{padding:28px 4px;color:var(--mute)}
.foot{margin-top:10px;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:92px;padding:12px 6px;border-radius:10px;color:#fff;text-decoration:none;background:linear-gradient(145deg,#0a2a6e 0%,#1557c8 100%);box-shadow:0 2px 6px #0a1e4f40;border:2px solid transparent;overflow-wrap:anywhere}
.tile b{font:700 clamp(17px,4.6vw,22px)/1.1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.tile small{font-size:12px;line-height:1.2;opacity:.85}
.tile:hover,.tile:focus-visible{background:linear-gradient(145deg,#0f3a94 0%,#2a6fe0 100%);outline:none;border-color:#4da3ff}
.tile:active{transform:scale(.98)}
.tile.on{border-color:#4da3ff;box-shadow:0 0 0 2px #4da3ff66,0 2px 6px #0a1e4f40}
.tile.on small{opacity:1;font-weight:600;color:#bfe0ff}
.tile.kosong{background:linear-gradient(145deg,#3b5a94 0%,#5a7cb8 100%)}
.wk{font:700 22px/1.1 "Barlow Condensed",sans-serif;color:var(--navy);margin:20px 0 10px}
.tile .hr{font:600 12px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.tile.now{background:linear-gradient(145deg,#1557c8 0%,#4da3ff 100%);border-color:#fff;box-shadow:0 0 0 3px #1557c8,0 4px 12px #0a1e4f66}
.tile.now .hr::after{content:" · hari ini";color:#fff;font-weight:700}
button.gps{font-size:14px;padding:8px 14px;min-height:36px;background:#1557c8;color:#fff;border-color:#1557c8}
button.gps:disabled{opacity:.6}
a.maplink{display:inline-flex;align-items:center;min-height:36px;padding:4px 10px;border-radius:6px;background:#e4eeff;color:var(--acc);font-weight:600;text-decoration:none;white-space:nowrap}
a.maplink:hover,a.maplink:focus-visible{background:#cfe0ff}
td select{width:100%;height:42px;border:0;background:transparent;font:inherit;text-align:center;padding:0 4px;cursor:pointer}
td select:focus{background:#e8f1ff}
td select[data-v=ya]{color:var(--ok);font-weight:700}
td select[data-v=tidak]{color:#b42318;font-weight:700}
a.pusat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;margin:0 0 18px;padding:26px 12px;border-radius:12px;color:#fff;text-decoration:none;background:linear-gradient(120deg,#051233 0%,#0a2a6e 50%,#1450b8 100%);border:2px solid #4da3ff;box-shadow:0 4px 14px #0a1e4f55}
a.pusat b{font:700 clamp(34px,10vw,54px)/1 "Barlow Condensed",sans-serif;letter-spacing:.04em}
a.pusat small{font-size:14px;opacity:.85}
a.pusat:hover,a.pusat:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
tr.grp td{background:#dbe7fb;font:700 18px "Barlow Condensed",sans-serif;text-align:left;padding:8px 10px;color:var(--navy)}
.pd table{min-width:640px}
.sat{overflow-x:auto;overflow-y:hidden;background:#fff;border-bottom:1px solid var(--soft)}.sat div{height:1px}
.ov{position:fixed;inset:0;background:#051233b3;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov[hidden]{display:none}
.ov form{background:#fff;border-radius:12px;padding:20px;width:min(340px,100%);box-shadow:0 10px 40px #0008}
.ov h3{margin:0 0 4px;font:700 24px/1.1 "Barlow Condensed",sans-serif}
.ov p{margin:0 0 10px;color:var(--mute);font-size:14px}
.ov input{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:6px}
.ov .err{color:#b42318;min-height:20px;margin:6px 0;font-size:14px}
.ov .btns{display:flex;gap:8px;justify-content:flex-end}
.ov button{font:600 15px Barlow,sans-serif;padding:9px 16px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.ov button.pri{background:var(--line);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.act{font:600 14px Barlow,sans-serif;padding:9px 14px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer;min-height:38px}
.act.pri{background:var(--line);color:#fff}.act.red{color:#b42318;border-color:#b42318}.act:disabled{opacity:.6}
.bar .sub{margin:0}
td select:disabled,td input.k:disabled{background:#eef1f6;cursor:not-allowed;color:#8a94a8}
.ck{white-space:nowrap}
.ov label{display:block;font-weight:600;font-size:14px;margin-top:8px}
tr.tag td:first-child{box-shadow:inset 4px 0 0 #d92d20;background:#fff1f0}
.sg{white-space:nowrap;color:#b42318;font-weight:700}.sg.l{color:#1f7a4d}.tg{white-space:nowrap}
tr.lun td:first-child{box-shadow:inset 4px 0 0 #1f7a4d;background:#effaf3}
td input.k[data-f=n]:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink)}
@media print{header.top,.tabs,.back,.sync{display:none}}
#kunci{position:fixed;inset:0;z-index:40;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}#kunci[hidden]{display:none}#kunci h2{margin:0;font:700 clamp(26px,7vw,40px)/1.1 "Barlow Condensed",sans-serif}#kunci p{margin:0;max-width:420px;opacity:.85}#kunci .ic{font-size:56px;line-height:1}
tr.bad td{background:#fdecea !important}tr.bad select,tr.bad input.k{border-color:#b42318 !important;outline:2px solid #b42318}
button.del{color:#b42318;border-color:#b42318;font-weight:600;white-space:nowrap}button.del[hidden]{display:none}
button.cb{color:#b42318;border-color:#b42318;font-weight:600;white-space:nowrap}
.mtf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mtf input,.mtf select{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;min-width:0;width:100%}.mtf .act{grid-column:1/-1}
a.pusat.mtb{background:linear-gradient(120deg,#073d27 0%,#0b5a3a 50%,#1f8f5f 100%)}a.pusat.mtb b{font-size:clamp(28px,8vw,40px)}
.tile.mt{background:linear-gradient(145deg,#0b5a3a 0%,#1f8f5f 100%)}.tile.mt:hover,.tile.mt:focus-visible{background:linear-gradient(145deg,#0f6e47 0%,#27a870 100%)}
</style>
</head>

function infoHariIni(d = new Date()){
  /* Minggu 1 dimulai pada hari Senin pertama tiap bulan. Tanggal sebelum Senin pertama ikut bulan sebelumnya. */
  const firstMon = (y,m) => 1 + ((8 - new Date(y,m,1).getDay()) % 7);
  let y = d.getFullYear(), m = d.getMonth(), fm = firstMon(y,m);
  if (d.getDate() < fm) { m--; if (m<0) { m=11; y--; } fm = firstMon(y,m); }
  const diff = Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(y,m,fm)) / 864e5);
  const n = Math.floor(diff/7) + 1, hi = (d.getDay()+6) % 7;
  return {d, n, hari: HARI[hi] || null, bulan: y+'-'+String(m+1).padStart(2,'0'), grup: n>4 ? null : (n%2 ? '1 / 3' : '2 / 4')};
}

function listen(kid, cb){
  if (unsub) { unsub(); unsub = null; }
  /* Tunggu data server dulu supaya nama toko tidak muncul sebentar lalu hilang (kalau sudah diupload hari ini). Data lokal hanya dipakai kalau server tidak menjawab. */
  if (!fs) { cb(lsGet(kid)); return; }
  const me = {}; listen.cur = me; let got = false;
  unsub = fs.onSnapshot(fs.doc(db,'rute',kid), s => { got = true; cb((s.data()||{}).d||{}); }, () => { setSync('Koneksi terputus','warn'); got = true; cb(lsGet(kid)); });
  setTimeout(() => { if (!got && listen.cur === me) cb(lsGet(kid)); }, 2500);
}

function clearWeek(kid, bl, mg, n){

/* Excel berformat rapi (warna, garis, lebar kolom). Susunan kolom tetap sama supaya bisa di-upload lagi sebagai master. */
async function saveStyled(blocks, sheetName, file){
  const EJ = await loadEJ();
  const wb = new EJ.Workbook(), ws = wb.addWorksheet(sheetName.slice(0,31), {pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, paperSize:9}});
  ws.columns = [{width:7},{width:34},{width:26},{width:13},{width:34},{width:18},{width:16}];
  const thin = {style:'thin', color:{argb:'FF9AA9C7'}}, box = {top:thin, left:thin, bottom:thin, right:thin};
  const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:c}});
  const banner = (text, bg, fg, bold, h) => { const r = ws.addRow([text]); ws.mergeCells(r.number,1,r.number,7);
    const c = r.getCell(1); c.fill = fill(bg); c.font = {name:'Calibri', size:11, bold, color:{argb:fg}}; c.alignment = {vertical:'middle', horizontal:'left', wrapText:true, indent:1}; r.height = h; return r; };
  blocks.forEach(b => {
    banner(b.head, 'FF0A1E4F', 'FFFFFFFF', true, 30);
    if (b.note) banner(b.note, 'FFFFF4CC', 'FF5A4500', false, 22);
    const hr = ws.addRow(['NO','NAMA TOKO','LATLONG','TRANSAKSI','KETERANGAN','CHECK-IN','KODE TOKO']); hr.height = 22;
    hr.eachCell(c => { c.fill = fill('FF1557C8'); c.font = {name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'}}; c.alignment = {vertical:'middle', horizontal:'center'}; c.border = box; });
    if (!b.rows.length) { const r = ws.addRow(['(belum ada toko)']); ws.mergeCells(r.number,1,r.number,7); const c = r.getCell(1); c.font = {italic:true, color:{argb:'FF7A8499'}}; c.alignment = {horizontal:'center'}; c.border = box; }
    b.rows.forEach((row, i) => {
      const r = ws.addRow(row); r.height = 20;
      r.eachCell({includeEmpty:true}, (c, n) => { if (n>7) return;
        c.border = box; c.font = {name:'Calibri', size:11}; if (i%2) c.fill = fill('FFF3F7FD');
        c.alignment = {vertical:'middle', horizontal: (n===2||n===5) ? 'left' : 'center', wrapText: n===2||n===5}; });
      const tr = String(row[3]||'').toLowerCase();
      if (tr==='ya') r.getCell(4).font = {name:'Calibri', size:11, bold:true, color:{argb:'FF1F7A4D'}};
      else if (tr==='tidak') r.getCell(4).font = {name:'Calibri', size:11, bold:true, color:{argb:'FFB42318'}};
      r.getCell(3).value = String(row[3-1]||''); r.getCell(7).value = String(row[6]||'');
    });
    ws.addRow([]);
  });
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = file; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* Terapkan banyak upload ke satu objek master T. items = [{kec, rows}]. Mengembalikan jumlah toko yang ditambah/dilengkapi. */
let poBaru = [];
function terapkanKeMaster(T, items, baruOut){
  KEC.forEach(k => { if (!T[k[0]]) T[k[0]] = []; });
  let n = 0;
  items.forEach(({kec, rows}) => {
    const list = T[kec]; if (!list) return;
    rows.filter(r => r.t==='ya').forEach(r => {
      const nm = r.n.trim().toUpperCase(); if (!nm) return;
      const m = (r.a||'').match(/^geo:(-?[\d.]+),(-?[\d.]+)$/), lat = m ? +m[1] : null, lng = m ? +m[2] : null;
      const ex = list.find(x => (r.c && x[0]===r.c) || x[1]===nm) || (r.c ? Object.values(T).flat().find(x => x[0]===r.c) : null);
      if (ex) { let ch = false; if (!r.c && ex[2]==null && lat!=null) { ex[2]=lat; ex[3]=lng; ch = true; } if (!ex[4]) { ex[4] = 1; ch = true; } if (ch) n++; return; }
      const tg = [...(TAGIHAN.toko||[]), ...Object.values(TAGIHAN.lunas||{})].find(t => t.kota==='PDG' && t.nama.toUpperCase()===nm);
      const kd = r.c || (tg ? tg.kode : ''); list.push([kd, nm, lat, lng, 1]); n++; if (baruOut) baruOut.push({kec, nama:nm, kode:kd, lat, lng});
    });
  });

}
/* Simpan hasil ke master. Di Firebase memakai transaksi supaya tidak menimpa perubahan lain. Mengembalikan jumlah, atau -1 kalau gagal. */
async function tambahKeMasterBanyak(items){
  if (fs) {
    try {
      let n = 0, hasil = null;
      await fs.runTransaction(db, async tx => {
        const ref = fs.doc(db,'config','master'), sn = await tx.get(ref);
        const T = (sn.exists() && sn.data().json) ? JSON.parse(sn.data().json) : JSON.parse(JSON.stringify(TOKO));
        poBaru = []; n = terapkanKeMaster(T, items, poBaru); hasil = T;
        if (n) {
          const doc = {json: JSON.stringify(T), ts: Date.now()}, v = sn.exists() ? sn.data().ver : MASTER_VER;
          if (v) doc.ver = v;
          tx.set(ref, doc);
        }
      });
      TOKO = hasil; calcBaris();
      if (n) { try { localStorage.setItem('master', JSON.stringify(TOKO)); } catch(e){} setSync('Tersambung ke Firebase','ok'); }
      return n;
    } catch(e){ return -1; }
  }
  poBaru = [];
  const n = terapkanKeMaster(TOKO, items, poBaru);
  if (n) simpanMaster();
  return n;
}

function pindahDi(T, dari, nm, ke){
  KEC.forEach(k => { if (!T[k[0]]) T[k[0]] = []; });
  if (!T[ke]) return 'Kecamatan tujuan tidak dikenal.';
  const a = T[dari] || [], i = a.findIndex(x => x[1]===nm);
  if (i < 0) return 'Toko tidak ditemukan di kecamatan '+dari+'. Muat ulang halaman.';
  if (T[ke].some(x => x[1]===nm)) return 'Sudah ada toko bernama '+nm+' di '+ke+'.';
  T[ke].push(a.splice(i,1)[0]);
  return '';
}

async function hapusDataToko(semua){
  if (!(await askPw(semua ? 'Hapus semua data' : 'Hapus data kecuali tagihan', semua ? 'Masukkan password untuk menghapus SEMUA data toko (termasuk tagihan).' : 'Masukkan password untuk menghapus semua data toko kecuali toko yang Ada tagihan.', 'Lanjut'))) return;
  /* pakai data terbaru dari server supaya tidak menghapus berdasarkan salinan lama */
  try { await segarkanConfig(); await mtMuat(); } catch(e){}
  const nPdg = Object.values(TOKO).reduce((n,a)=>n+a.length,0), nMt = mtSemua().length;
  const nTag = (TAGIHAN.toko||[]).length, nLunas = Object.keys(TAGIHAN.lunas||{}).length;
  const kosongMt = () => mtNorm({});
  if (semua) {
    if (!confirm('Anda yakin untuk hapus data tagihan juga?\n\nYang akan dihapus SEMUA:\n• Data Master Padang: '+nPdg+' toko\n• Master Toko: '+nMt+' toko\n• Data tagihan: '+nTag+' toko Ada tagihan, '+nLunas+' toko Tidak ada tagihan (luar kota)\n\nTidak bisa dibatalkan. Pastikan Backup sudah diunduh.')) return;
    if (!(await askPw('Konfirmasi hapus semua', 'Masukkan password sekali lagi untuk menghapus SEMUA data toko dan data tagihan.', 'Hapus semua'))) return;
    const T = {}; KEC.forEach(k => T[k[0]] = []);
    TOKO = T; simpanMaster();
    setTagihan({tgl:'', file:'', toko:[], lunas:{}, sel:{}, semuaTagih:1});
    MTOKO = kosongMt(); await mtSimpan();
    alert('Selesai. Semua data toko dan data tagihan sudah dihapus.'); pusatPage(); return;
  }
  /* Hapus kecuali tagihan: Data Master (Ada tagihan dan Tidak ada tagihan) dan semua Toko pernah order tetap. Yang dihapus hanya toko di Master Toko yang tidak terkait Data Master / tagihan. */
  const keep = new Set([...(TAGIHAN.toko||[]).map(t => t.kode), ...Object.keys(TAGIHAN.lunas||{})]);
  const T = {}; let sisaPdg = 0;
  KEC.forEach(k => { T[k[0]] = (TOKO[k[0]]||[]).slice(); sisaPdg += T[k[0]].length; T[k[0]].forEach(x => { if (x[0]) keep.add(x[0]); }); });
  const M = kosongMt(); let sisaMt = 0;
  MT_JENIS.forEach(j => { M[j[0]] = MTOKO[j[0]].filter(t => keep.has(t.id)); sisaMt += M[j[0]].length; });
  M['pernah-order'] = (MTOKO['pernah-order']||[]).slice(); sisaMt += M['pernah-order'].length;
  const sel = {}; Object.keys(TAGIHAN.sel||{}).forEach(k => { if (keep.has(k)) sel[k] = TAGIHAN.sel[k]; });
  if (!confirm('Hapus data Master Toko KECUALI yang terkait Data Master / tagihan?\n\n• Data Master Padang (Ada tagihan dan Tidak ada tagihan): '+sisaPdg+' toko tetap\n• Toko luar kota Ada tagihan: '+nTag+' tetap, Tidak ada tagihan: '+nLunas+' tetap\n• Toko pernah order: '+(MTOKO['pernah-order']||[]).length+' toko tetap\n• Master Toko lainnya (Retail, Semi Grosir, Grosir, Belum Diisi): '+(nMt-sisaMt)+' toko dihapus, '+sisaMt+' toko tetap\n\nTidak bisa dibatalkan. Pastikan Backup sudah diunduh.')) return;
  TOKO = T; simpanMaster();
  setTagihan({...TAGIHAN, sel});
  MTOKO = M; await mtSimpan();
  alert('Selesai. Data Master (Ada tagihan dan Tidak ada tagihan) dan Toko pernah order tetap utuh.'); pusatPage();
}
function pusatPage(){
  $app.innerHTML = '<a class="back" href="#">‹ Semua wilayah</a><h2>Pusat Data</h2><div class="bar"><button type="button" class="act red" id="hpall">🗑 Hapus semua</button><button type="button" class="act red" id="hpkec">🗑 Hapus kecuali tagihan</button></div><div class="tabs">' +

function nextVisits(hari, grup, n=2){
  const out = [], d = new Date(); d.setHours(12,0,0,0);
  for (let i=0; i<70 && out.length<n; i++) { const x = new Date(d); x.setDate(d.getDate()+i); const f = infoHariIni(x);
    if (f.hari===hari && f.grup===grup) out.push(new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short'}).format(x)); }
  return out.join(', ');
}
/* Scrollbar geser di atas tabel, sinkron dengan yang di bawah. */
function scrollAtas(box){
  const atas = document.createElement('div'), isi = document.createElement('div');
  atas.className = 'sat'; atas.setAttribute('aria-hidden','true'); atas.appendChild(isi);
  box.parentNode.insertBefore(atas, box);
  const ukur = () => { isi.style.width = box.scrollWidth+'px'; atas.hidden = box.scrollWidth <= box.clientWidth + 1; };
  let kunci = false;
  atas.onscroll = () => { if (kunci) { kunci = false; return; } kunci = true; box.scrollLeft = atas.scrollLeft; };
  box.onscroll = () => { if (kunci) { kunci = false; return; } kunci = true; atas.scrollLeft = box.scrollLeft; };
  ukur();
  if (window.ResizeObserver) { const ro = new ResizeObserver(ukur); ro.observe(box); const t = box.querySelector('table'); if (t) ro.observe(t); }
  else window.addEventListener('resize', ukur);
}
/* Edit toko di Data Master (menu Ada tagihan, kecamatan Padang): nama, kode, kecamatan, latitude, longitude. */
function editTokoMaster(kec, nm, body){
  const r0 = (TOKO[kec]||[]).find(x => x[1]===nm); if (!r0) return alert('Toko tidak ditemukan di master. Muat ulang halaman.');
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px';
  const st = 'width:100%;font:inherit;padding:9px;border:1.5px solid var(--line);border-radius:6px;margin:4px 0 10px;background:#fff;box-sizing:border-box';
  ov.innerHTML = '<div role="dialog" aria-modal="true" style="background:#fff;border-radius:10px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto"><h3 style="margin:0 0 12px">Edit toko</h3>' +
    '<label>Nama toko<input id="etn" style="'+st+';text-transform:uppercase" value="'+esc(r0[1])+'" autocomplete="off"></label>' +
    '<label>Kode toko<input id="etk" style="'+st+';text-transform:uppercase" value="'+esc(r0[0]||'')+'" placeholder="isi kode" autocomplete="off"></label>' +
    '<label>Kecamatan<select id="etc" style="'+st+'">'+KEC.map(k => '<option value="'+esc(k[0])+'"'+(k[0]===kec ? ' selected' : '')+'>'+esc(k[0])+' ('+k[2]+', Minggu '+k[1]+')</option>').join('')+'</select></label>' +
    '<label>Latitude<input id="etla" inputmode="decimal" style="'+st+'" value="'+(r0[2]??'')+'" placeholder="-0.xxxxx"></label>' +
    '<label>Longitude<input id="etlo" inputmode="decimal" style="'+st+'" value="'+(r0[3]??'')+'" placeholder="100.xxxxx"></label>' +
    '<p class="sub" id="ete" style="color:#b42318;min-height:1.2em;margin:0 0 8px"></p><div class="bar"><button type="button" class="act" id="etno">Batal</button><button type="button" class="act pri" id="etok">Simpan</button></div></div>';
  document.body.appendChild(ov);
  const $e = i => ov.querySelector('#'+i), pesan = m => { $e('ete').textContent = m; };
  $e('etno').onclick = () => ov.remove();
  $e('etok').onclick = async () => {
    const nama = $e('etn').value.replace(/\s+/g,' ').trim().toUpperCase(), kode = $e('etk').value.trim().toUpperCase(), ke = $e('etc').value;
    let la = $e('etla').value, lo = $e('etlo').value;
    if (/^\s*-?[\d.]+\s*,\s*-?[\d.]+\s*$/.test(la)) { const p = la.split(','); la = p[0]; lo = p[1]; }
    const parse = s => { s = s.trim().replace(',', '.'); return s==='' ? null : (isFinite(s) ? parseFloat(s) : NaN); };
    const LA = parse(la), LN = parse(lo);
    if (!nama) return pesan('Nama toko tidak boleh kosong.');
    if (Number.isNaN(LA)) return pesan('Latitude harus berupa angka.');
    if (Number.isNaN(LN)) return pesan('Longitude harus berupa angka.');
    if ((LA==null) !== (LN==null)) return pesan('Isi latitude dan longitude sekaligus, atau kosongkan keduanya.');
    if (LA!=null && (Math.abs(LA)>90 || Math.abs(LN)>180)) return pesan('Koordinat di luar rentang (lat -90..90, long -180..180).');
    if (ke!==kec) {
      const kt = KEC.find(k => k[0]===ke), kd = KEC.find(k => k[0]===kec);
      if (!confirm('Pindahkan '+nm+'?\n\nDari: '+kec+' ('+kd[2]+', Minggu '+kd[1]+')\nKe: '+ke+' ('+kt[2]+', Minggu '+kt[1]+')\n\nToko langsung pindah di rute kunjungan salesman Padang. Isian kunjungan yang belum diupload di HP salesman untuk kecamatan asal bisa ikut terhapus, jadi sebaiknya dipindah saat tidak ada kunjungan berjalan.')) return;
    }
    $e('etok').disabled = true;
    if (fs) { try { const sn = await fs.getDoc(fs.doc(db,'config','master')); if (sn.exists() && sn.data().json) TOKO = JSON.parse(sn.data().json); } catch(e){} }
    const row = (TOKO[kec]||[]).find(x => x[1]===nm);
    const gagal = m => { $e('etok').disabled = false; pesan(m); };
    if (!row) return gagal('Toko tidak ditemukan di master. Muat ulang halaman.');
    if ((TOKO[ke]||[]).some(x => x!==row && x[1]===nama)) return gagal('Nama '+nama+' sudah ada di kecamatan '+ke+'.');
    const dup = kode && Object.entries(TOKO).flatMap(([k,a]) => a.map(x => [k,x])).find(([k,x]) => x!==row && x[0]===kode);
    if (dup) return gagal('Kode '+kode+' sudah dipakai toko '+dup[1][1]+' ('+dup[0]+').');
    row[0] = kode; row[1] = nama; row[2] = LA; row[3] = LN; simpanMaster();
    if (ke!==kec) {
      const h = await pindahToko(kec, nama, ke);
      if (h.err) { $e('etok').disabled = false; return pesan('Nama, kode, dan koordinat sudah tersimpan, tetapi pindah kecamatan gagal: '+h.err); }
    }
    /* Kalau kodenya juga ada di Master Toko, datanya di sana disamakan */
    try { await mtMuat(); const m = kode ? mtSemua().find(t => t.id===kode) : null;
      if (m) { const o = MTOKO[m.js].find(t => t.id===kode); o.nama = nama; o.lat = LA; o.lon = LN; if (mtPre(kode)==='PDG') o.kec = ke; await mtSimpan(); } } catch(e){}
    try { await mtMuat(); const p = (MTOKO['pernah-order']||[]).find(t => t.po && t.po.kec===kec && t.po.nama===nm); if (p) { p.nama = nama; p.lat = LA; p.lon = LN; p.kec = ke; p.po = {kec:ke, nama}; if (kode) p.id = kode; await mtSimpan(); } } catch(e){}
    ov.remove(); masterView(body);
  };
}

    home();
    askPw().then(ok => { if (ok) { pusatOk = true; pusatPage(); window.scrollTo(0,0); } else if (location.hash==='#pusat-data') location.hash = ''; });
    return;
  }
  if (w==='master-toko') return ks==='pernah-order' ? masterTokoPO() : masterToko(ks, sub);
  if (w==='padang') return ks ? detail(ks) : kecList();
  const nm = WILAYAH.find(x=>slug(x)===w); if (!nm) return home();
  return detailWilayah(nm);
}
window.addEventListener('hashchange', route);
route();
renderTgl();
let tglTerakhir = hariIniStr();
setInterval(async () => {
  renderTgl();
  const now = hariIniStr();
  if (now !== tglTerakhir) {
    tglTerakhir = now;
    await segarkanConfig();
    if (refreshW) refreshW();
    const ae = document.activeElement;
    if (!(ae && ae.closest && ae.closest('tbody'))) route();
  }
}, 60000);
/* Ambil master & tagihan terbaru dari Firebase (toko tambahan ikut masuk). */
async function segarkanConfig(){
  if (!fs) return;
  let ch = false;
  const hasil = await Promise.all(['master','tagihan'].map(nm => fs.getDoc(fs.doc(db,'config',nm)).then(sn => sn.exists() ? sn.data().json : null).catch(() => null)));
  ['master','tagihan'].forEach((nm, i) => {
    const j = hasil[i];
    try {
      if (j && j !== localStorage.getItem(nm)) {
        const o = JSON.parse(j);
        if (nm==='master') { TOKO = o; calcBaris(); } else { TAGIHAN = o; calcTag(); }
        try { localStorage.setItem(nm, j); } catch(e){}
        ch = true;
      }
    } catch(e){}
  });
  if (ch) { const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('tbody'))) route(); }
}
initFirebase().then(async () => {
  if (fs) fs.onSnapshot(fs.doc(db,'config','status'), sn => { const off = !!(sn.exists() && sn.data().off); if (off !== appOff) setOff(off); }, () => {});
  let baru = false;
  try {
    if (fs) { const sn = await fs.getDoc(fs.doc(db,'config','master')); if ((sn.exists() ? sn.data().ver : null) !== MASTER_VER) { terapkanMasterBaru(); baru = true; } }
    else if (localStorage.getItem('masterVer') !== MASTER_VER) { terapkanMasterBaru(); baru = true; }
  } catch(e){}
  if (baru) { const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('tbody'))) route(); }
  await segarkanConfig();
  mtMuat().then(() => { if (!location.hash.replace('#','')) route(); });
  migrasiSemuaKeTagihan();
});

/* ---- Saklar aplikasi: dimatikan/dihidupkan dengan password, berlaku untuk semua pengguna ---- */
function tampilKunci(){
  document.getElementById('kunci').hidden = !appOff;
  $app.inert = appOff; document.querySelector('header.top').inert = appOff;
  if (appOff && !$up.hidden) closeUp(null);
}
function setOff(v){ appOff = v; try { localStorage.setItem('appOff', v ? '1' : '0'); } catch(e){} tampilKunci(); if (!v) route(); }
async function ubahSaklar(mati){
  const ok = await askPw(mati ? 'Hentikan aplikasi' : 'Aktifkan aplikasi',
    mati ? 'Masukkan password untuk menghentikan aplikasi. Semua pengguna tidak akan bisa memakainya.' : 'Masukkan password untuk mengaktifkan aplikasi kembali.',
    mati ? 'Hentikan' : 'Aktifkan');
  if (!ok) return;
  if (fs) {
    try { await fs.setDoc(fs.doc(db,'config','status'), {off:mati, ts:Date.now()}); setSync('Tersambung ke Firebase','ok'); }
    catch(e){ setSync('Gagal menyimpan status ke Firebase','warn'); return alert('Gagal menyimpan status ke Firebase (koneksi bermasalah). Tidak ada yang diubah, coba lagi.'); }
  }
  setOff(mati);
}
document.getElementById('aktifkan').onclick = () => ubahSaklar(false);
tampilKunci();
