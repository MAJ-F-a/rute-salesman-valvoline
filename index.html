<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b33;--paper:#eef3fb;--line:#12285a;--soft:#cdd8ea;--mute:#55627a;--acc:#1557c8;--navy:#0a1e4f;--ok:#1f7a4d;--warn:#9a6700}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(120deg,#051233 0%,#0a2a6e 55%,#1450b8 100%);color:#fff;border-bottom:4px solid #4da3ff}
header.top .wrap{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;padding-top:16px;padding-bottom:14px;align-items:center}
h1{margin:0;font:700 clamp(22px,5.4vw,38px)/1.05 "Barlow Condensed",sans-serif;letter-spacing:.01em}
header.top .wrap{flex-wrap:wrap}.brand{display:flex;gap:14px;align-items:center;flex:1 1 260px;min-width:0}.logo{width:clamp(54px,15vw,80px);height:auto;aspect-ratio:1;border-radius:50%;flex:none;box-shadow:0 0 0 2px #ffffff40,0 4px 14px #00000066}
.tgl{margin-top:8px;font-size:15px;opacity:.92}
.jad td.now{background:#d6e6ff;box-shadow:inset 0 -4px 0 var(--acc)}.jad td.now a{color:var(--acc)}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;background:#ffffff26;white-space:nowrap}
.sync.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px}
.sync.warn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fbbf24;margin-right:6px}
main{padding-top:20px;padding-bottom:48px}
h2{font:700 26px/1.1 "Barlow Condensed",sans-serif;margin:6px 0 4px}
.back{display:inline-block;margin:0 0 8px;color:var(--acc);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.sub{color:var(--mute);margin:0 0 14px}
.list{border-top:2px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--soft);color:inherit;text-decoration:none;min-height:54px}
.row:hover,.row:focus-visible{background:#fff;outline:none;box-shadow:inset 4px 0 0 var(--acc)}
.row b{font:700 22px/1 "Barlow Condensed",sans-serif}
.row .no{display:inline-block;width:30px;color:var(--mute);font-weight:500}
.row small{color:var(--mute)}
.row.on small{color:var(--acc);font-weight:600}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.bln{margin-left:auto;font-weight:600;font-size:15px}.bln input{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:4px;background:#fff}
.mini{font:600 12px Barlow,sans-serif;padding:4px 8px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;margin-left:4px}
.al{min-width:190px}.al input{width:calc(100% - 92px)}
.tabs button{font:600 15px Barlow,sans-serif;padding:8px 16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;border-radius:4px}
.tabs button[aria-pressed=true]{background:var(--line);color:#fff}
.tabs button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.scroll{overflow-x:auto;background:#fff}
table{border-collapse:collapse;width:100%;min-width:700px}
caption{caption-side:top;text-align:center;padding:6px;font-size:15px}
th,td{border:1px solid var(--line);padding:0 8px;height:44px;text-align:center}
th{font-weight:600;background:#fff}
td.l{text-align:left}
td a{color:#1d4ed8}
td input{width:100%;height:42px;border:0;background:transparent;font:inherit;text-align:center;padding:0 4px}
td input.k{text-align:left}
td input:focus{background:#e8f1ff}
.jad table{min-width:660px;table-layout:fixed}.jad td{height:auto;padding:0}.jad td a{display:block;padding:22px 8px;color:var(--ink);font:700 19px/1.15 "Barlow Condensed",sans-serif;text-decoration:none}.jad td a small{display:block;margin-top:4px;font:400 12px Barlow,sans-serif;color:var(--mute)}.jad td a:hover,.jad td a:focus-visible{background:#e4eeff;color:var(--acc);outline:none}
#hi a{color:var(--acc)}
.empty{padding:28px 4px;color:var(--mute)}
.foot{margin-top:10px;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:92px;padding:12px 6px;border-radius:10px;color:#fff;text-decoration:none;background:linear-gradient(145deg,#0a2a6e 0%,#1557c8 100%);box-shadow:0 2px 6px #0a1e4f40;border:2px solid transparent;overflow-wrap:anywhere}
.tile b{font:700 clamp(17px,4.6vw,22px)/1.1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.tile small{font-size:12px;line-height:1.2;opacity:.85}
.tile:hover,.tile:focus-visible{background:linear-gradient(145deg,#0f3a94 0%,#2a6fe0 100%);outline:none;border-color:#4da3ff}
.tile:active{transform:scale(.98)}
.tile.on{border-color:#4da3ff;box-shadow:0 0 0 2px #4da3ff66,0 2px 6px #0a1e4f40}
.tile.on small{opacity:1;font-weight:600;color:#bfe0ff}
.tile.kosong{background:linear-gradient(145deg,#3b5a94 0%,#5a7cb8 100%)}
.wk{font:700 22px/1.1 "Barlow Condensed",sans-serif;color:var(--navy);margin:20px 0 10px}
.tile .hr{font:600 12px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.tile.now{background:linear-gradient(145deg,#1557c8 0%,#4da3ff 100%);border-color:#fff;box-shadow:0 0 0 3px #1557c8,0 4px 12px #0a1e4f66}
.tile.now .hr::after{content:" · hari ini";color:#fff;font-weight:700}
button.gps{font-size:14px;padding:8px 14px;min-height:36px;background:#1557c8;color:#fff;border-color:#1557c8}
button.gps:disabled{opacity:.6}
a.maplink{display:inline-flex;align-items:center;min-height:36px;padding:4px 10px;border-radius:6px;background:#e4eeff;color:var(--acc);font-weight:600;text-decoration:none;white-space:nowrap}
a.maplink:hover,a.maplink:focus-visible{background:#cfe0ff}
td select{width:100%;height:42px;border:0;background:transparent;font:inherit;text-align:center;padding:0 4px;cursor:pointer}
td select:focus{background:#e8f1ff}
td select[data-v=ya]{color:var(--ok);font-weight:700}
td select[data-v=tidak]{color:#b42318;font-weight:700}
a.pusat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;margin:0 0 18px;padding:26px 12px;border-radius:12px;color:#fff;text-decoration:none;background:linear-gradient(120deg,#051233 0%,#0a2a6e 50%,#1450b8 100%);border:2px solid #4da3ff;box-shadow:0 4px 14px #0a1e4f55}
a.pusat b{font:700 clamp(34px,10vw,54px)/1 "Barlow Condensed",sans-serif;letter-spacing:.04em}
a.pusat small{font-size:14px;opacity:.85}
a.pusat:hover,a.pusat:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
tr.grp td{background:#dbe7fb;font:700 18px "Barlow Condensed",sans-serif;text-align:left;padding:8px 10px;color:var(--navy)}
.pd table{min-width:640px}
.ov{position:fixed;inset:0;background:#051233b3;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov[hidden]{display:none}
.ov form{background:#fff;border-radius:12px;padding:20px;width:min(340px,100%);box-shadow:0 10px 40px #0008}
.ov h3{margin:0 0 4px;font:700 24px/1.1 "Barlow Condensed",sans-serif}
.ov p{margin:0 0 10px;color:var(--mute);font-size:14px}
.ov input{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:6px}
.ov .err{color:#b42318;min-height:20px;margin:6px 0;font-size:14px}
.ov .btns{display:flex;gap:8px;justify-content:flex-end}
.ov button{font:600 15px Barlow,sans-serif;padding:9px 16px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.ov button.pri{background:var(--line);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.act{font:600 14px Barlow,sans-serif;padding:9px 14px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer;min-height:38px}
.act.pri{background:var(--line);color:#fff}.act.red{color:#b42318;border-color:#b42318}.act:disabled{opacity:.6}
.bar .sub{margin:0}
td select:disabled,td input.k:disabled{background:#eef1f6;cursor:not-allowed;color:#8a94a8}
.ck{white-space:nowrap}
.ov label{display:block;font-weight:600;font-size:14px;margin-top:8px}
tr.tag td:first-child{box-shadow:inset 4px 0 0 #d92d20;background:#fff1f0}
.sg{white-space:nowrap;color:#b42318;font-weight:700}
@media print{header.top,.tabs,.back,.sync{display:none}}
</style>
</head>

function infoHariIni(d = new Date()){
  /* Minggu 1 dimulai pada hari Senin pertama tiap bulan. Tanggal sebelum Senin pertama ikut bulan sebelumnya. */
  const firstMon = (y,m) => 1 + ((8 - new Date(y,m,1).getDay()) % 7);
  let y = d.getFullYear(), m = d.getMonth(), fm = firstMon(y,m);
  if (d.getDate() < fm) { m--; if (m<0) { m=11; y--; } fm = firstMon(y,m); }
  const diff = Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(y,m,fm)) / 864e5);
  const n = Math.floor(diff/7) + 1, hi = (d.getDay()+6) % 7;
  return {d, n, hari: HARI[hi] || null, bulan: y+'-'+String(m+1).padStart(2,'0'), grup: n>4 ? null : (n%2 ? '1 / 3' : '2 / 4')};
}

/* Excel berformat rapi (warna, garis, lebar kolom). Susunan kolom tetap sama supaya bisa di-upload lagi sebagai master. */
async function saveStyled(blocks, sheetName, file){
  const EJ = await loadEJ();
  const wb = new EJ.Workbook(), ws = wb.addWorksheet(sheetName.slice(0,31), {pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, paperSize:9}});
  ws.columns = [{width:7},{width:34},{width:26},{width:13},{width:34},{width:11},{width:16}];
  const thin = {style:'thin', color:{argb:'FF9AA9C7'}}, box = {top:thin, left:thin, bottom:thin, right:thin};
  const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:c}});
  const banner = (text, bg, fg, bold, h) => { const r = ws.addRow([text]); ws.mergeCells(r.number,1,r.number,7);
    const c = r.getCell(1); c.fill = fill(bg); c.font = {name:'Calibri', size:11, bold, color:{argb:fg}}; c.alignment = {vertical:'middle', horizontal:'left', wrapText:true, indent:1}; r.height = h; return r; };
  blocks.forEach(b => {
    banner(b.head, 'FF0A1E4F', 'FFFFFFFF', true, 30);
    if (b.note) banner(b.note, 'FFFFF4CC', 'FF5A4500', false, 22);
    const hr = ws.addRow(['NO','NAMA TOKO','LATLONG','TRANSAKSI','KETERANGAN','CHECK-IN','KODE TOKO']); hr.height = 22;
    hr.eachCell(c => { c.fill = fill('FF1557C8'); c.font = {name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'}}; c.alignment = {vertical:'middle', horizontal:'center'}; c.border = box; });
    if (!b.rows.length) { const r = ws.addRow(['(belum ada toko)']); ws.mergeCells(r.number,1,r.number,7); const c = r.getCell(1); c.font = {italic:true, color:{argb:'FF7A8499'}}; c.alignment = {horizontal:'center'}; c.border = box; }
    b.rows.forEach((row, i) => {
      const r = ws.addRow(row); r.height = 20;
      r.eachCell({includeEmpty:true}, (c, n) => { if (n>7) return;
        c.border = box; c.font = {name:'Calibri', size:11}; if (i%2) c.fill = fill('FFF3F7FD');
        c.alignment = {vertical:'middle', horizontal: (n===2||n===5) ? 'left' : 'center', wrapText: n===2||n===5}; });
      const tr = String(row[3]||'').toLowerCase();
      if (tr==='ya') r.getCell(4).font = {name:'Calibri', size:11, bold:true, color:{argb:'FF1F7A4D'}};
      else if (tr==='tidak') r.getCell(4).font = {name:'Calibri', size:11, bold:true, color:{argb:'FFB42318'}};
      r.getCell(3).value = String(row[3-1]||''); r.getCell(7).value = String(row[6]||'');
    });
    ws.addRow([]);
  });
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = file; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

}

/* Terapkan banyak upload ke satu objek master T. items = [{kec, rows}]. Mengembalikan jumlah toko yang ditambah/dilengkapi. */
function terapkanKeMaster(T, items){
  KEC.forEach(k => { if (!T[k[0]]) T[k[0]] = []; });
  let n = 0;
  items.forEach(({kec, rows}) => {
    const list = T[kec]; if (!list) return;
    rows.filter(r => r.t==='ya').forEach(r => {
      const nm = r.n.trim().toUpperCase(); if (!nm) return;
      const m = (r.a||'').match(/^geo:(-?[\d.]+),(-?[\d.]+)$/), lat = m ? +m[1] : null, lng = m ? +m[2] : null;
      const ex = list.find(x => (r.c && x[0]===r.c) || x[1]===nm);
      if (ex) { if (ex[2]==null && lat!=null) { ex[2]=lat; ex[3]=lng; n++; } return; }
      const tg = (TAGIHAN.toko||[]).find(t => t.kota==='PDG' && t.nama.toUpperCase()===nm);
      list.push([r.c || (tg ? tg.kode : ''), nm, lat, lng]); n++;
    });
  });
  return n;
}
/* Simpan hasil ke master. Di Firebase memakai transaksi supaya tidak menimpa perubahan lain. Mengembalikan jumlah, atau -1 kalau gagal. */
async function tambahKeMasterBanyak(items){
  if (fs) {
    try {
      let n = 0, hasil = null;
      await fs.runTransaction(db, async tx => {
        const ref = fs.doc(db,'config','master'), sn = await tx.get(ref);
        const T = (sn.exists() && sn.data().json) ? JSON.parse(sn.data().json) : JSON.parse(JSON.stringify(TOKO));
        n = terapkanKeMaster(T, items); hasil = T;
        if (n) {
          const doc = {json: JSON.stringify(T), ts: Date.now()}, v = sn.exists() ? sn.data().ver : MASTER_VER;
          if (v) doc.ver = v;
          tx.set(ref, doc);
        }
      });
      TOKO = hasil; calcBaris();
      if (n) { try { localStorage.setItem('master', JSON.stringify(TOKO)); } catch(e){} setSync('Tersambung ke Firebase','ok'); }
      return n;
    } catch(e){ return -1; }
  }
  const n = terapkanKeMaster(TOKO, items);

async function kumpulBackup(){
  const out = {app:'rute-salesman-valvoline', versi:1, waktu:new Date().toISOString(), master:TOKO, tagihan:TAGIHAN, uploads:[], rute:{}};
  if (fs) {
    const cfg = async nm => { const sn = await fs.getDoc(fs.doc(db,'config',nm)); return sn.exists() && sn.data().json ? JSON.parse(sn.data().json) : null; };
    const m = await cfg('master'); if (m) out.master = m;
    const t = await cfg('tagihan'); if (t) out.tagihan = t;
    (await fs.getDocs(fs.collection(db,'uploads'))).forEach(d => out.uploads.push(d.data()));
    (await fs.getDocs(fs.collection(db,'rute'))).forEach(d => { const x = (d.data()||{}).d; if (x && Object.keys(x).length) out.rute[d.id] = x; });
  } else {

    for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k && k.startsWith('rute:')) { const o = lsGet(k.slice(5)); if (Object.keys(o).length) out.rute[k.slice(5)] = o; } }

    (blm ? '<p class="sub" style="color:#b42318">⚠ '+blm+' toko masih perlu dipilih wilayahnya (kolom Wilayah).</p>' : '') +
    '<div class="bar"><button class="act pri" id="tup">⬆ Upload Excel tagihan</button><button class="act red" id="tclr">Kosongkan tagihan</button><input type="file" id="tf" accept=".xlsx,.xls" hidden></div>' +
    '<input id="ts" type="search" placeholder="Cari kode, nama toko, atau kota…" autocomplete="off" style="width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:6px;margin-bottom:10px">' +
    '<div class="scroll pd"><table style="min-width:760px"><caption>Toko yang punya tagihan</caption><thead><tr><th style="width:48px">No.</th><th style="width:170px">Kode toko</th><th>Nama toko</th><th style="width:70px">Kota</th><th style="width:170px">Wilayah</th><th style="width:150px">Kecamatan (master)</th><th style="width:140px">Sisa tagihan</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">Belum ada data.</td></tr>')+'</tbody></table></div>';
  const f = document.getElementById('tf');
  document.getElementById('tup').onclick = () => f.click();
  f.onchange = () => { if (f.files[0]) importTagihan(f.files[0]).catch(()=>alert('File tidak bisa dibaca atau pustaka Excel gagal dimuat.')); f.value = ''; };
  document.getElementById('tclr').onclick = () => { if (confirm('Kosongkan semua data tagihan?')) { setTagihan({tgl:'', file:'', toko:[], sel:{}}); pusatPage(); } };
  document.getElementById('ts').oninput = e => { const v = e.target.value.trim().toLowerCase(); body.querySelectorAll('tbody tr').forEach(tr => { tr.hidden = !!v && !(tr.dataset.s||'').includes(v); }); };
  body.querySelectorAll('[data-sel]').forEach(sl => sl.onchange = () => { const sel = {...(TAGIHAN.sel||{})}; if (sl.value) sel[sl.dataset.sel] = sl.value; else delete sel[sl.dataset.sel]; setTagihan({...TAGIHAN, sel}); tagihanView(body); });
}
async function uploadView(body){
  body.innerHTML = '<div class="tabs"><label class="bln">Bulan <input type="month" id="ubln" value="'+upBln+'"></label></div><p class="sub" id="usum">Memuat…</p>' +
    '<div class="bar"><button class="act pri" id="udl">⬇ Unduh Excel bulan ini</button><button class="act red" id="uclr">Bersihkan data bulan ini</button></div><div class="bar"><button class="act pri" id="uproc">▶ Mulai proses hasil kerja hari ini</button><span class="sub" id="uprocs"></span></div><div id="ulist"></div>';
  document.getElementById('ubln').onchange = e => { if (e.target.value) { upBln = e.target.value; uploadView(body); } };
  const list = await getUploads(upBln);
  const box = document.getElementById('ulist'); if (!box) return;
  const ya = list.reduce((n,u)=>n+u.rows.filter(r=>r.t==='ya').length,0), tk = list.reduce((n,u)=>n+u.rows.length,0);
  document.getElementById('usum').textContent = list.length+' upload · '+tk+' kunjungan toko · '+ya+' transaksi Ya';
  document.getElementById('udl').onclick = () => unduhUpload(upBln, list).catch(()=>alert('Gagal memuat pustaka Excel. Cek koneksi internet.'));
  document.getElementById('uclr').onclick = () => bersihkan(upBln, list);
  const pb = document.getElementById('uproc'); if (pb) pb.onclick = async () => { pb.disabled = true; try { await prosesHariIni(); } finally { pb.disabled = false; } };
  const blm = list.filter(u => u.diproses===false && u.kec).length;
  const ps = document.getElementById('uprocs'); if (ps) ps.textContent = blm ? blm+' upload bulan ini belum diproses ke Data Master' : 'Semua upload bulan ini sudah diproses';
  box.innerHTML = list.length ? '<div class="scroll pd"><table><caption>Daftar upload</caption><thead><tr><th style="width:90px">Upload ke</th><th>Tanggal</th><th>Lokasi</th><th>Salesman</th><th>Toko</th><th>Check-in</th><th>Transaksi Ya</th><th>Tidak</th></tr></thead><tbody>' +
    list.map((u,i)=>'<tr><td>'+(i+1)+'</td><td>'+fmtTgl(u.tgl)+'</td><td class="l">'+esc(u.kec ? u.kec : u.wil+' ('+u.hari+')')+(u.sesuai===false?' ⚠ di luar jadwal':'')+(u.ket?'<br><small>'+esc(u.ket)+'</small>':'')+'</td><td class="l">'+esc(u.sales||'-')+'</td><td>'+u.rows.length+'</td><td>'+u.rows.filter(r=>r.g).length+'</td><td>'+u.rows.filter(r=>r.t==='ya').length+'</td><td>'+u.rows.filter(r=>r.t==='tidak').length+'</td></tr>').join('') +
    '</tbody></table></div>' : '<p class="empty">Belum ada upload di bulan ini.</p>';
}
function kecList(){
  const grup = m => '<h3 class="wk">Minggu '+m+'</h3><div class="grid">' + HARI.map(h => { const k = KEC.find(x=>x[1]===m && x[2]===h); if (!k) return '';
    const c = (TOKO[k[0]]||[]).length, tg = (TOKO[k[0]]||[]).filter(x=>TAGSET.has(x[0])).length;
    return '<a class="tile'+(c?'':' kosong')+'" data-m="'+m+'" data-h="'+h+'" href="#padang/'+slug(k[0])+'"><span class="hr">'+h+'</span><b>'+esc(k[0])+'</b><small>'+(c?c+' toko'+(tg?' · '+tg+' tagih':''):'belum ada data')+'</small></a>'; }).join('') + '</div>';
  $app.innerHTML = '<a class="back" href="#">‹ Semua wilayah</a><h2>Padang</h2><p class="sub">12 kecamatan, dikunjungi 2 kali sebulan. Ketuk kecamatan untuk mengisi kunjungan.</p><p class="sub" id="hi"></p>' + grup('1 / 3') + grup('2 / 4'); renderTgl();
}
function hariList(w){
  const now = infoHariIni().hari;
  $app.innerHTML = '<a class="back" href="#">‹ Semua wilayah</a><h2>'+esc(w)+'</h2><p class="sub">Pilih hari kunjungan. Toko yang punya tagihan ('+autoToko(w).length+' toko) terisi otomatis.</p><div class="grid">' +
    HARI.map(h => '<a class="tile'+(h===now?' now':'')+'" href="#'+slug(w)+'/'+slug(h)+'"><span class="hr">kunjungan</span><b>'+h+'</b><small>buka daftar toko</small></a>').join('') + '</div>';
}

let minggu = null, bulan = infoHariIni().bulan;
const q = (tr,f) => tr.querySelector('[data-f='+f+']');
const geoUrl = g => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(g.slice(4));
function renderAl(tr){
  const a = tr.dataset.a || '', td = tr.querySelector('.al');
  td.innerHTML = a.startsWith('geo:')
    ? '<a class="maplink" target="_blank" rel="noopener" href="'+esc(geoUrl(a))+'">📍 Buka Google Maps</a> <button type="button" class="mini" data-x="1" aria-label="Hapus lokasi">×</button>'
    : '<span class="sub">terisi saat check-in</span>';
  renderCk(tr);
}
function renderCk(tr){
  const g = tr.dataset.g || '', h = tr.dataset.h || '', td = tr.querySelector('.ck');
  td.innerHTML = g
    ? '<a class="maplink" target="_blank" rel="noopener" href="'+esc(geoUrl('geo:'+g))+'">✔ '+esc(h)+'</a>'
    : '<button type="button" class="mini gps" data-ci="1">📍 Check-in</button>';
  q(tr,'t').disabled = q(tr,'k').disabled = !g;
}

function tabel(cfg){
  const {kid, back, backLabel, caption, weeks, toko} = cfg;
  const NR = Math.max(BARIS, toko.length);
  if (!weeks.includes(minggu)) { const wk = String(infoHariIni().n); minggu = weeks.includes(wk) ? wk : weeks[cfg.def||0]; }
  const html = '<a class="back" href="'+back+'">‹ '+esc(backLabel)+'</a><div class="tabs" role="group" aria-label="Minggu kunjungan">' +
    weeks.map(w=>'<button data-w="'+w+'" aria-pressed="'+(w===minggu)+'">Minggu '+w+'</button>').join('') +
    '<label class="bln">Bulan <input type="month" id="bln" value="'+bulan+'"></label></div>' +
    '<div class="scroll"><table><caption>'+esc(caption)+'</caption><thead><tr><th style="width:48px">No.</th><th style="min-width:150px">nama toko</th><th style="min-width:190px">Alamat</th><th style="width:120px">Check-in</th><th style="width:130px">Sisa tagihan</th><th style="width:130px">Transaksi</th><th style="min-width:160px">Keterangan</th></tr></thead><tbody>' +
    Array.from({length:NR},(_,i)=>'<tr data-i="'+i+'"><td>'+(i+1)+'</td>' +
      '<td><input class="k" data-f="n" autocomplete="off" aria-label="Nama toko '+(i+1)+'"></td><td class="al"></td><td class="ck"></td><td class="sg"></td>' +
      '<td><select data-f="t" aria-label="Transaksi '+(i+1)+'"><option value="">Pilih</option><option value="ya">Ya</option><option value="tidak">Tidak</option></select></td>' +
      '<td><input class="k" data-f="k" aria-label="Keterangan '+(i+1)+'"></td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="bar"><button type="button" class="act pri" id="up">⬆ Upload kunjungan hari ini</button><span id="ups" class="sub"></span></div>' +
    '<p class="foot">Setelah selesai kunjungan hari ini, tekan Upload agar data masuk ke Pusat Data. Setelah berhasil terupload, isian tabel ini otomatis dikosongkan karena datanya sudah ada di Pusat Data. Maksimal '+NR+' kunjungan per hari. Tekan Check-in saat berada di toko: titik GPS dan jam tersimpan. Kolom Transaksi dan Keterangan baru bisa diisi setelah check-in. Lokasi dan nama toko tersimpan untuk minggu dan bulan berikutnya. Semua isian tersimpan otomatis.</p>';
  $app.innerHTML = html;
  $app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { minggu = b.dataset.w; tabel(cfg); });
  document.getElementById('bln').onchange = e => { if (e.target.value) { bulan = e.target.value; tabel(cfg); } };

  const trs = [...$app.querySelectorAll('tbody tr')];
  const dflt = i => toko[i] ? {n:toko[i][1].toLowerCase(), a:(toko[i][2]!=null && toko[i][3]!=null ? 'geo:'+toko[i][2]+','+toko[i][3] : ''), t:'', k:''} : {};
  const fill = d => {
  const selesai = d['u_'+bulan+'_'+minggu] === hariIniStr();
  const usEl = document.getElementById('ups'); if (selesai && usEl && !usEl.textContent) usEl.textContent = '✔ Sudah diupload hari ini. Daftar toko muncul lagi pada kunjungan berikutnya.';
  const used = new Set();
  trs.forEach((_,i) => { const x = d[bulan+'_'+minggu+'_'+i]; if (x && x.n && x.n.trim()) used.add(x.n.trim().toUpperCase()); });
  trs.forEach((tr,i) => {
    if (tr.contains(document.activeElement)) return;
    const mst = null, dr = d[bulan+'_'+minggu+'_'+i], cd = toko[i] ? toko[i][0] : '';
    const v = (dr && (!cfg.auto || (dr.c||'')===cd)) ? dr : (mst ? {n:mst.n, a:mst.a, t:'', k:''} : (!cfg.auto && !dr && toko[i] && used.has(toko[i][1].toUpperCase()) ? {} : (selesai ? {} : dflt(i))));
    q(tr,'n').value = v.n||''; q(tr,'k').value = v.k||'';
    const t = q(tr,'t'); t.value = v.t||''; t.dataset.v = t.value;
    tr.dataset.a = v.a||''; tr.dataset.g = v.g||''; tr.dataset.h = v.h||''; tr.dataset.c = (v===dr ? (dr.c||'') : cd); renderAl(tr);
    const tg = !!(toko[i] && TAGSET.has(toko[i][0]) && (v.n||'').trim().toUpperCase()===toko[i][1].toUpperCase());
    tr.classList.toggle('tag', tg); tr.querySelector('.sg').textContent = tg ? rp(TAGSISA[toko[i][0]]) : ''; tr.cells[0].innerHTML = (i+1)+(tg ? '<br><small style="color:#b42318;font-weight:700">TAGIH</small>' : '');
  });
  };
  listen(kid, fill);

  const rowData = tr => ({n:q(tr,'n').value, a:tr.dataset.a||'', g:tr.dataset.g||'', h:tr.dataset.h||'', c:tr.dataset.c||'', t:q(tr,'t').value, k:q(tr,'k').value});
  const commit = (tr, bl, mg) => {
    const r = rowData(tr);
    save(kid, bl+'_'+mg+'_'+tr.dataset.i, r);
  };
  const timers = new Map();
  const queue = tr => { const bl = bulan, mg = minggu; clearTimeout(timers.get(tr)); timers.set(tr, setTimeout(()=>{ timers.delete(tr); commit(tr,bl,mg); }, 500)); };
  const tb = $app.querySelector('tbody');
  document.getElementById('up').onclick = async () => {
    const ub = document.getElementById('up'), us = document.getElementById('ups');
    const blUp = bulan, mgUp = minggu;
    [...timers.keys()].forEach(tr => { clearTimeout(timers.get(tr)); commit(tr, bulan, minggu); }); timers.clear();
    const rows = trs.map((tr,i) => ({...rowData(tr), c:(toko[i] && q(tr,'n').value.trim().toUpperCase()===toko[i][1].toUpperCase()) ? toko[i][0] : ''})).filter(r => r.n.trim()).map(r => ({n:r.n.trim().toUpperCase(), a:r.a, g:r.g, h:r.h, c:r.c, t:r.t, k:r.k.trim()}));
    if (!rows.length) return alert('Belum ada toko yang diisi.');
    const d = new Date(), p2 = n => String(n).padStart(2,'0'), tgl = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    const belum = rows.filter(r => !r.g).length, inf = infoHariIni(d), kk = cfg.kec ? KEC.find(x => x[0]===cfg.kec) : null;
    const sesuai = kk ? (inf.hari===kk[2] && inf.grup===kk[1]) : null;
    let info = rows.length+' toko, tanggal '+fmtTgl(tgl)+'. Upload ulang oleh salesman yang sama di kecamatan dan minggu yang sama pada hari ini akan menimpa upload sebelumnya.';
    if (belum) info += ' '+belum+' toko belum check-in.';
    if (sesuai===false) info += ' PERHATIAN: hari ini bukan jadwal kecamatan ini ('+kk[2]+', minggu '+kk[1]+').';
    const f = await askUpload(info); if (!f) return;
    ub.disabled = true; us.textContent = 'Mengirim…';
    const u = {id:tgl+'_'+kid+'_m'+minggu+'_'+(slug(f.sales)||'x'), tgl, bln:tgl.slice(0,7), kid, kec:cfg.kec||'', wil:cfg.wil||'', hari:cfg.hari||'', minggu, sales:f.sales, ket:f.ket, sesuai, ts:Date.now(), diproses:false, rows};
    const ok = await saveUpload(u);
    const nb = 0; /* toko baru masuk Data Master lewat tombol admin di Pusat Data */
    let bersih = false;
    if (ok) {
      /* Sudah masuk Pusat Data: kosongkan isian tabel di HP supaya siap untuk kunjungan berikutnya */
      bersih = await clearWeek(kid, blUp, mgUp, NR);
      if (bulan===blUp && minggu===mgUp && document.body.contains(tb)) fill(lsGet(kid));
    }
    ub.disabled = false;
    us.textContent = ok ? '✔ Terupload '+rows.length+' toko oleh '+f.sales+' ('+fmtTgl(tgl)+' '+p2(d.getHours())+':'+p2(d.getMinutes())+')'+(nb ? ' · '+nb+' toko masuk Data Master' : '')+(bersih ? ' · isian tabel dikosongkan' : '') : 'Gagal upload, coba lagi. Isian tabel tidak dihapus.';
  };

  const onEdit = e => {
    const tr = e.target.closest('tr'), f = e.target.dataset.f; if (!tr || !f) return;
    if (f==='t') e.target.dataset.v = e.target.value;
    queue(tr);
  };
  tb.addEventListener('input', onEdit);
  tb.addEventListener('change', e => { if (e.target.dataset.f === 't') onEdit(e); });
  tb.addEventListener('focusout', e => {
    const tr = e.target.closest('tr');
    if (tr && timers.has(tr)) { clearTimeout(timers.get(tr)); timers.delete(tr); commit(tr, bulan, minggu); }
  });
  tb.addEventListener('click', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    if (e.target.dataset.x) { tr.dataset.a = ''; renderAl(tr); commit(tr, bulan, minggu); }
    if (e.target.dataset.ci) {
      const btn = e.target, bl = bulan, mg = minggu;
      if (!q(tr,'n').value.trim()) return alert('Isi nama toko dulu sebelum check-in.');
      if (!navigator.geolocation) return alert('Perangkat ini tidak mendukung lokasi.');
      btn.disabled = true; btn.textContent = 'Mencari…';
      navigator.geolocation.getCurrentPosition(
        p => { const ll = p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6), d = new Date(), p2 = n => String(n).padStart(2,'0');
          tr.dataset.g = ll; tr.dataset.h = p2(d.getHours())+':'+p2(d.getMinutes());
          if (!(tr.dataset.a||'').startsWith('geo:')) tr.dataset.a = 'geo:'+ll;
          renderAl(tr); commit(tr, bl, mg); },
        () => { btn.disabled = false; btn.textContent = '📍 Check-in'; alert('Lokasi tidak bisa diambil. Aktifkan GPS dan izin lokasi untuk web ini.'); },
        {enableHighAccuracy:true, timeout:20000, maximumAge:0});
    }
  });
}
function detail(ks){
  const k = KEC.find(x=>slug(x[0])===ks); if (!k) return kecList();
  const [nama, mm, hari] = k;
  tabel({kid:'padang-'+ks, back:'#padang', backLabel:'Padang', caption:nama.toLowerCase()+' ('+hari.toLowerCase()+', Minggu '+mm+')', weeks:mm.split(' / '), def:0, kec:nama, toko:TOKO[nama]||[]});
}
function detailHari(w, h){
  tabel({kid:slug(w)+'-'+slug(h), back:'#'+slug(w), backLabel:w, caption:w.toLowerCase()+' ('+h.toLowerCase()+')', weeks:['1','2','3','4'], def:3, wil:w, hari:h, toko:autoToko(w), auto:true});
}

function route(){
  if (unsub) { unsub(); unsub = null; }
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch(e){}
  const [w, ks] = h.split('/');
  window.scrollTo(0,0);
  if (!$pw.hidden) closePw(false);
  if (!$up.hidden) closeUp(null);
  if (w !== 'pusat-data') pusatOk = false;
  if (!w) return home();
  if (w==='pusat-data') {
    if (pusatOk) return pusatPage();
    home();
    askPw().then(ok => { if (ok) { pusatOk = true; pusatPage(); window.scrollTo(0,0); } else if (location.hash==='#pusat-data') location.hash = ''; });
    return;
  }
  if (w==='padang') return ks ? detail(ks) : kecList();
  const nm = WILAYAH.find(x=>slug(x)===w); if (!nm) return home();
  if (!ks) return hariList(nm);
  const hr = HARI.find(x=>slug(x)===ks); return hr ? detailHari(nm, hr) : hariList(nm);
}
window.addEventListener('hashchange', route);
route();
renderTgl();
let tglTerakhir = hariIniStr();
setInterval(async () => {
  renderTgl();
  const now = hariIniStr();
  if (now !== tglTerakhir) {
    tglTerakhir = now;
    await segarkanConfig();
    const ae = document.activeElement;
    if (!(ae && ae.closest && ae.closest('tbody'))) route();
  }
}, 60000);
/* Ambil master & tagihan terbaru dari Firebase (toko tambahan ikut masuk). */
async function segarkanConfig(){
  if (!fs) return;
  let ch = false;
  const hasil = await Promise.all(['master','tagihan'].map(nm => fs.getDoc(fs.doc(db,'config',nm)).then(sn => sn.exists() ? sn.data().json : null).catch(() => null)));
  ['master','tagihan'].forEach((nm, i) => {
    const j = hasil[i];
    try {
      if (j && j !== localStorage.getItem(nm)) {
        const o = JSON.parse(j);
        if (nm==='master') { TOKO = o; calcBaris(); } else { TAGIHAN = o; calcTag(); }
        try { localStorage.setItem(nm, j); } catch(e){}
        ch = true;
      }
    } catch(e){}
  });
  if (ch) { const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('tbody'))) route(); }
}
initFirebase().then(async () => {
  let baru = false;
  try {
    if (fs) { const sn = await fs.getDoc(fs.doc(db,'config','master')); if ((sn.exists() ? sn.data().ver : null) !== MASTER_VER) { terapkanMasterBaru(); baru = true; } }
    else if (localStorage.getItem('masterVer') !== MASTER_VER) { terapkanMasterBaru(); baru = true; }
  } catch(e){}
  if (baru) { const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('tbody'))) route(); }
  await segarkanConfig();
});

/* Pasang sebagai aplikasi (Add to Home Screen) */
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
